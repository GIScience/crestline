[project]
name = "crestaxis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
    "scipy-stubs~=1.18.1",
    "shapely>=2.2.0",
]

[project.optional-dependencies]
cpu = []
cu12 = ["numba-cuda[cu12]>=0.30.4"]
cu13 = ["numba-cuda[cu13]>=0.30.4"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu12" }, { extra = "cu13" }]]
